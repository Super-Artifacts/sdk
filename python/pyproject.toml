[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superartifacts"
version = "0.1.0"
description = "Python SDK for the Super Artifacts REST API: publish artifacts and read their data from your own code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Super Artifacts" }]
keywords = ["super-artifacts", "artifacts", "publishing", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3"]

[project.urls]
Homepage = "https://superartifacts.app/docs/sdks/python"
Repository = "https://github.com/Super-Artifacts/sdk"
Issues = "https://github.com/Super-Artifacts/sdk/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/superartifacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/superartifacts/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
